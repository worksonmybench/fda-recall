<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Recalls · US Food Recalls</title>
  <meta name="description" content="Search and filter FDA and USDA food recall events by date, reason, food, class, size and state.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="search.js"></script>
  <script type="module" src="nav.js"></script>
</head>
<body>
  <div class="viz-root">
    <nav class="site-nav" aria-label="Site">
      <a class="brand" href="./">US food recalls</a>
      <div class="nav-links">
        <a href="./">Overview</a>
        <a href="state.html">By state</a>
        <a href="search.html">Search</a>
        <a href="about.html">About</a>
      </div>
      <form class="nav-search" id="nav-search" role="search">
        <label for="nav-search-input" class="visually-hidden">Find a recall by number, UPC or event ID</label>
        <input id="nav-search-input" type="search" placeholder="Recall #, UPC or event ID" autocomplete="off">
        <button type="submit">Find</button>
      </form>
    </nav>
    <div class="search-results" id="nav-search-results" aria-live="polite"></div>
    <header class="page-header">
      <h1>Search recalls</h1>
      <p class="subtitle" id="data-updated">Loading recall index…</p>
    </header>

    <form id="filters" class="card search-form" role="search">
      <div class="field wide">
        <label for="q">Keywords</label>
        <input id="q" name="q" type="search" placeholder="Firm or product, e.g. peanut butter" autocomplete="off">
      </div>

      <fieldset class="field date-range">
        <legend>Date</legend>
        <div class="row">
          <select id="date-field" name="date" aria-label="Which date">
            <option value="reported">Reported by FDA</option>
            <option value="started">Recall started</option>
          </select>
          <input id="from" name="from" type="date" aria-label="From">
          <span class="muted">to</span>
          <input id="to" name="to" type="date" aria-label="To">
        </div>
        <div class="presets" id="date-presets">
          <button type="button" data-preset="30d">Last 30 days</button>
          <button type="button" data-preset="12m">Last 12 months</button>
          <button type="button" data-preset="ytd">This year</button>
          <button type="button" data-preset="all">All dates</button>
        </div>
      </fieldset>

      <div class="field">
        <label for="agency">Agency</label>
        <select id="agency" name="agency">
          <option value="">FDA and USDA</option>
          <option value="fda">FDA: most foods</option>
          <option value="usda">USDA: meat, poultry and egg products</option>
        </select>
      </div>
      <div class="field">
        <label for="reason">Why it was recalled</label>
        <select id="reason" name="reason"><option value="">Any reason</option></select>
      </div>
      <div class="field">
        <label for="category">Kind of food</label>
        <select id="category" name="category"><option value="">Any food</option></select>
      </div>
      <div class="field">
        <label for="state">State</label>
        <div class="row">
          <select id="state" name="state"><option value="">Any state</option></select>
          <select id="state-view" name="view" aria-label="How the state is related">
            <option value="impacting">impacted</option>
            <option value="originating">firm located there</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="">Open or closed</option>
          <option value="open">Still ongoing</option>
          <option value="closed">Closed</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Class</legend>
        <div class="checks" id="class-checks">
          <label><input type="checkbox" name="class" value="I"> Class I</label>
          <label><input type="checkbox" name="class" value="II"> Class II</label>
          <label><input type="checkbox" name="class" value="III"> Class III</label>
          <label><input type="checkbox" name="class" value="none"> No class (incl. USDA alerts)</label>
        </div>
      </fieldset>
      <fieldset class="field">
        <legend>Size</legend>
        <div class="checks" id="size-checks"></div>
      </fieldset>
      <fieldset class="field">
        <legend>Other</legend>
        <div class="checks">
          <label><input type="checkbox" name="illness" value="1"> Illnesses reported</label>
          <label><input type="checkbox" name="nationwide" value="1"> Nationwide only</label>
        </div>
      </fieldset>

      <div class="field form-actions">
        <button type="button" id="clear-filters">Clear all filters</button>
      </div>
    </form>

    <main id="content">
      <div class="results-bar">
        <p id="result-count" aria-live="polite"></p>
        <label class="sort">Sort
          <select id="sort" name="sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="largest">Largest first</option>
            <option value="products">Most products</option>
          </select>
        </label>
      </div>
      <div class="table-scroll card" id="results"></div>
      <nav class="pager" id="pager" aria-label="Result pages"></nav>
    </main>

    <footer class="page-footer">
      Sources: <a href="https://open.fda.gov/data/downloads/">openFDA food enforcement reports</a> and the <a href="https://www.fsis.usda.gov/science-data/developer-resources/recall-api">USDA FSIS Recall API</a>.
      Categories, sizes and locations are derived from the agencies' free-text records and are approximate.
    </footer>
  </div>
</body>
</html>
