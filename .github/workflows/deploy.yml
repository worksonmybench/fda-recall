# Tests and checks the committed export on every push and pull request; pushes
# to main then deploy dist/ to Cloudflare. dist/ is built locally (see
# "Refresh and deploy" in the README), so this makes no calls to FDA, USDA or
# the NYT: the only network call is the deploy.
name: deploy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Tests
        run: python -m unittest

      # The export copies site/ into dist/ verbatim, so a page change committed
      # without re-exporting shows up as a mismatch here.
      - name: dist/ matches site/
        run: |
          status=0
          for f in site/*; do
            cmp -s "$f" "dist/${f#site/}" || { echo "::error file=$f::dist/ is out of date with $f; run python3 -m fda_recall.web.export"; status=1; }
          done
          for f in dist/*; do
            [ -d "$f" ] || [ -e "site/${f#dist/}" ] || { echo "::error::$f is not in site/; re-export"; status=1; }
          done
          [ -f dist/api/trends.json ] || { echo "::error::dist/api is missing; run the export"; status=1; }
          exit $status

      - uses: actions/setup-node@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          node-version: lts/*

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.0 deploy
